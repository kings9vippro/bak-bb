services:
  - type: web
    name: alb-forge
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python -m playwright install chromium
    startCommand: |
      python -m playwright install chromium 2>/dev/null || true
      python main.py
    healthCheckPath: /
